<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>ETH ↔ WDM Conversion</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<style>

/* =========================================================
   기본
========================================================= */

body {

    background: #111;
    color: #ffffff;

}

.container {

    max-width: 650px;

}

.card {

    background: #1f1f1f;

    border: 1px solid #444;

    border-radius: 15px;

}

h2,
h3,
h4,
h5,
label {

    color: #ffffff;

}


/* =========================================================
   가격 표시
========================================================= */

.value {

    color: #00ff99;

    font-weight: bold;

}


/* =========================================================
   입력창
========================================================= */

.form-control,
.form-select {

    background: #2b2b2b !important;

    color: #ffffff !important;

    border: 1px solid #666;

}

.form-control:focus,
.form-select:focus {

    background: #2b2b2b !important;

    color: #ffffff !important;

    border-color: #ffc107;

    box-shadow: none;

}

.form-select option {

    background: #2b2b2b;

    color: #ffffff;

}

::placeholder {

    color: #bbbbbb;

}


/* =========================================================
   버튼
========================================================= */

.btn-warning {

    font-weight: bold;

}


/* =========================================================
   계산 결과
========================================================= */

#result {

    color: #00d9ff;

    font-weight: bold;

    word-break: break-word;

}

</style>

</head>


<body>


<div class="container mt-5">


<div class="card p-4">


<!-- =====================================================
     CLOSE BUTTON
===================================================== -->

<div style="margin-bottom:20px;">

    <button
        type="button"
        class="btn btn-danger"
        onclick="window.close();"
    >

        ✖ CLOSE

    </button>

</div>


<!-- =====================================================
     TITLE
===================================================== -->

<h2 class="text-center text-warning mb-4">

    ETH ↔ WDM Conversion

</h2>


<!-- =====================================================
     SWAP DIRECTION
===================================================== -->

<div class="mb-3">

    <label
        for="direction"
        class="form-label"
    >

        Swap Direction

    </label>


    <select
        id="direction"
        class="form-select"
    >

        <option value="ETH_TO_WDM">

            ETH → WDM

        </option>


        <option value="WDM_TO_ETH">

            WDM → ETH

        </option>

    </select>

</div>


<!-- =====================================================
     AMOUNT
===================================================== -->

<div class="mb-4">

    <label
        for="amount"
        class="form-label"
    >

        Amount

    </label>


    <input
        type="number"
        id="amount"
        class="form-control"
        value="1"
        step="0.00000001"
        min="0"
        placeholder="Enter amount"
        autocomplete="off"
    >

</div>


<hr>


<!-- =====================================================
     ETH PRICE
===================================================== -->

<div class="d-flex justify-content-between mb-3">

    <h5>

        Current ETH Price

    </h5>


    <h5
        class="value"
        id="eth_price"
    >

        $ 0.00

    </h5>

</div>


<!-- =====================================================
     WDM PRICE
===================================================== -->

<div class="d-flex justify-content-between mb-4">

    <h5>

        Current WDM Price

    </h5>


    <h5
        class="value"
        id="wdm_price"
    >

        $ 0.00000000

    </h5>

</div>


<hr>


<!-- =====================================================
     ESTIMATED RECEIVE
===================================================== -->

<h4>

    Estimated Receive

</h4>


<h3
    id="result"
>

    0

</h3>


<!-- =====================================================
     CALCULATE BUTTON
===================================================== -->

<button
    type="button"
    class="btn btn-warning w-100 mt-4"
    onclick="calculateSwap()"
>

    Calculate Conversion

</button>


</div>

</div>


<script>

/* =========================================================
   Price Variables
========================================================= */

let ethPrice = 0;

let wdmPrice = 0;


/* =========================================================
   Load Latest Price
========================================================= */

async function loadPrice() {

    try {

        const response = await fetch(
            "/swap-api",
            {
                cache: "no-store"
            }
        );


        if (!response.ok) {

            throw new Error(
                "HTTP Error: " + response.status
            );

        }


        const data = await response.json();


        /* =================================================
           ETH Price
        ================================================= */

        const newEthPrice =
            Number(data.eth_price);


        /* =================================================
           WDM Price
        ================================================= */

        const newWdmPrice =
            Number(data.wdm_price);


        /* =================================================
           ETH 가격 갱신
        ================================================= */

        if (
            Number.isFinite(newEthPrice) &&
            newEthPrice > 0
        ) {

            ethPrice = newEthPrice;


            document.getElementById(
                "eth_price"
            ).textContent =
                "$ " + ethPrice.toFixed(2);

        }


        /* =================================================
           WDM 가격 갱신
        ================================================= */

        if (
            Number.isFinite(newWdmPrice) &&
            newWdmPrice > 0
        ) {

            wdmPrice = newWdmPrice;


            document.getElementById(
                "wdm_price"
            ).textContent =
                "$ " + wdmPrice.toFixed(8);

        }


        /* =================================================
           최신 가격으로 계산
        ================================================= */

        calculateSwap();

    }

    catch (error) {

        console.log(
            "Price update error:",
            error
        );

    }

}


/* =========================================================
   Calculate Conversion
========================================================= */

function calculateSwap() {


    /* =====================================================
       DOM 요소
    ===================================================== */

    const amountElement =
        document.getElementById("amount");


    const directionElement =
        document.getElementById("direction");


    const resultElement =
        document.getElementById("result");


    /* =====================================================
       입력값
    ===================================================== */

    const amount =
        Number(amountElement.value);


    const direction =
        directionElement.value;


    /* =====================================================
       유효성 검사
    ===================================================== */

    if (

        !Number.isFinite(amount) ||

        amount <= 0 ||

        !Number.isFinite(ethPrice) ||

        ethPrice <= 0 ||

        !Number.isFinite(wdmPrice) ||

        wdmPrice <= 0

    ) {

        resultElement.textContent = "0";

        return;

    }


    let receive = 0;


    /* =====================================================
       ETH → WDM
    ===================================================== */

    if (
        direction === "ETH_TO_WDM"
    ) {


        receive =
            (amount * ethPrice)
            / wdmPrice;


        resultElement.textContent =
            receive.toLocaleString(
                "en-US",
                {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }
            )
            + " WDM";


    }


    /* =====================================================
       WDM → ETH
    ===================================================== */

    else {


        receive =
            (amount * wdmPrice)
            / ethPrice;


        resultElement.textContent =
            receive.toLocaleString(
                "en-US",
                {
                    minimumFractionDigits: 8,
                    maximumFractionDigits: 8
                }
            )
            + " ETH";

    }

}


/* =========================================================
   Amount 실시간 계산
========================================================= */

document
    .getElementById("amount")
    .addEventListener(
        "input",
        calculateSwap
    );


/* =========================================================
   방향 변경 시 즉시 계산
========================================================= */

document
    .getElementById("direction")
    .addEventListener(
        "change",
        calculateSwap
    );


/* =========================================================
   페이지 최초 실행
========================================================= */

loadPrice();


/* =========================================================
   5초마다 최신 가격 갱신
========================================================= */

setInterval(
    loadPrice,
    5000
);

</script>


</body>

</html>
