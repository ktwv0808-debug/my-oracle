<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<title>FAQ CMS</title>

<style>

body{
    font-family:Arial;
    width:1000px;
    margin:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
}

textarea{
    width:100%;
    height:120px;
}

input[type=text]{
    width:100%;
}

button{
    padding:8px 20px;
}

</style>

</head>
<body>

<h1>FAQ CMS</h1>

{% if edit_row %}

<h3>FAQ 수정</h3>

<form method="POST">

<input type="hidden" name="action" value="edit">

<input type="hidden" name="id" value="{{ edit_row.id }}">

질문

<input
type="text"
name="question"
value="{{ edit_row.question }}"
required>

<br><br>

답변

<textarea
name="answer">{{ edit_row.answer }}</textarea>

<br><br>

<button type="submit">

수정완료

</button>

<a href="/admin/faq">

취소

</a>

</form>

{% else %}

<h3>FAQ 등록</h3>

<form method="POST">

<input type="hidden" name="action" value="add">

질문

<input
type="text"
name="question"
required>

<br><br>

답변

<textarea
name="answer"></textarea>

<br><br>

<button type="submit">

FAQ 등록

</button>

</form>

{% endif %}

<hr>

<table>

<tr>

<th>번호</th>

<th>질문</th>

<th>답변</th>

<th>관리</th>

</tr>

{% for row in rows %}

<tr>

<td>{{ row.id }}</td>

<td>{{ row.question }}</td>

<td>

{% if row.answer %}

{{ row.answer }}

{% else %}

<font color="red">

답변대기

</font>

{% endif %}

</td>

<td>

<a href="/admin/faq?edit={{ row.id }}">

수정

</a>

|

<a
href="/admin/faq/delete/{{ row.id }}"
onclick="return confirm('삭제하시겠습니까?');">

삭제

</a>

</td>

</tr>

{% endfor %}

</table>

</body>
</html>
