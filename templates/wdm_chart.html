<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>WDM Price Chart</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body {
            margin: 0; 
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #ffffff;
        }

        .chart-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        h2 {
            margin-bottom: 20px;
        }

        .chart-box {
            position: relative;
            width: 100%;
            height: 500px;
        }

    </style>

</head>

<body>
<div style="
    text-align: right;
    margin-bottom: 10px;
">

    <button
        onclick="window.close()"
        style="
            padding: 8px 18px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: #0066cc;
            color: white;
        "
    >
        Close
    </button>

</div>

<div class="chart-container">
<div class="chart-container">

  <h2 style="
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
">
    <img
        src="/static/WDM.svg"
        alt="WDM"
        style="
            width: 32px;
            height: 32px;
            object-fit: contain;
        "
    >
    WDM Price Chart
</h2>

    <div class="chart-box">

        <canvas id="wdmChart"></canvas>

    </div>

</div>


<script>

let wdmChart = null;


// ==========================================================
// WDM Chart Data 불러오기
// ==========================================================

async function loadWDMChart() {

    try {

        const response =
            await fetch("/wdm-chart-data");

        if (!response.ok) {

            throw new Error(
                "WDM chart data loading failed"
            );

        }

        const data =
            await response.json();


        // --------------------------------------------------
        // 데이터 확인
        // --------------------------------------------------

        console.log("WDM Chart Data:", data);


// --------------------------------------------------
// WDM 정상 가격 데이터만 사용
// 과거 ETH 가격이 WDM 차트에 저장된 데이터 제외
// --------------------------------------------------

const rawLabels =
    data.labels || [];

const rawPrices =
    data.prices || [];

const labels = [];

const prices = [];

for (let i = 0; i < rawPrices.length; i++) {

    const price =
        Number(rawPrices[i]);

    // WDM 가격만 차트에 표시
    // 과거 잘못 저장된 ETH 가격(약 $2,500) 제외
    if (
        Number.isFinite(price) &&
        price > 0 &&
        price < 1
    ) {

        labels.push(
            rawLabels[i]
        );

        prices.push(
            price
        );

    }

}


        // --------------------------------------------------
        // 기존 차트 제거
        // --------------------------------------------------

        if (wdmChart !== null) {

            wdmChart.destroy();

        }


        // --------------------------------------------------
        // Chart 생성
        // --------------------------------------------------

        const ctx =
            document
                .getElementById("wdmChart")
                .getContext("2d");


        wdmChart = new Chart(ctx, {

            type: "line",

            data: {

                labels: labels,

                datasets: [

                    {

                        label: "WDM Price",

                        data: prices,

                        borderWidth: 2,

                        pointRadius: 3,

                        pointHoverRadius: 5,

                        tension: 0.2,

                        fill: false

                    }

                ]

            },


            options: {

                responsive: true,

                maintainAspectRatio: false,

                interaction: {

                    mode: "index",

                    intersect: false

                },


                plugins: {

                    legend: {

                        display: true

                    },

                    tooltip: {

                        callbacks: {

                            label: function(context) {

                                return "WDM: $"
                                    + Number(
                                        context.raw
                                      ).toLocaleString(
                                        undefined,
                                        {
                                            maximumFractionDigits: 8
                                        }
                                      );

                            }

                        }

                    }

                },


                scales: {

                    x: {

                        title: {

                            display: true,

                            text: "Time"

                        },

                        ticks: {

                            maxTicksLimit: 10

                        }

                    },


                    y: {

                        title: {

                            display: true,

                            text: "WDM Price (USD)"

                        },

                        beginAtZero: false,

                        ticks: {

                            callback: function(value) {

                                return "$"
                                    + Number(value)
                                        .toLocaleString(
                                            undefined,
                                            {
                                                maximumFractionDigits: 8
                                            }
                                        );

                            }

                        }

                    }

                }

            }

        });

    }

    catch (error) {

        console.error(
            "WDM CHART ERROR:",
            error
        );

    }

}


// ==========================================================
// 페이지 로드
// ==========================================================

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadWDMChart();

    }
);

</script>

</body>

</html>
