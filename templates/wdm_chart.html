```html
<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>WDM Price Chart</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #ffffff;
        }

        .chart-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        h2 {
            margin-bottom: 20px;
        }

        .chart-box {
            position: relative;
            width: 100%;
            height: 500px;
        }

    </style>

</head>

<body>

<div class="chart-container">

    <h2>WDM Price Chart</h2>

    <div class="chart-box">

        <canvas id="wdmChart"></canvas>

    </div>

</div>


<script>

let wdmChart = null;


// ==========================================================
// WDM Chart Data 불러오기
// ==========================================================

async function loadWDMChart() {

    try {

        const response =
            await fetch("/wdm-chart-data");

        if (!response.ok) {

            throw new Error(
                "WDM chart data loading failed"
            );

        }

        const data =
            await response.json();


        // --------------------------------------------------
        // 데이터 확인
        // --------------------------------------------------

        console.log("WDM Chart Data:", data);


        const labels =
            data.labels || [];

        const prices =
            data.prices || [];


        // --------------------------------------------------
        // 기존 차트 제거
        // --------------------------------------------------

        if (wdmChart !== null) {

            wdmChart.destroy();

        }


        // --------------------------------------------------
        // Chart 생성
        // --------------------------------------------------

        const ctx =
            document
                .getElementById("wdmChart")
                .getContext("2d");


        wdmChart = new Chart(ctx, {

            type: "line",

            data: {

                labels: labels,

                datasets: [

                    {

                        label: "WDM Price",

                        data: prices,

                        borderWidth: 2,

                        pointRadius: 3,

                        pointHoverRadius: 5,

                        tension: 0.2,

                        fill: false

                    }

                ]

            },


            options: {

                responsive: true,

                maintainAspectRatio: false,

                interaction: {

                    mode: "index",

                    intersect: false

                },


                plugins: {

                    legend: {

                        display: true

                    },

                    tooltip: {

                        callbacks: {

                            label: function(context) {

                                return "WDM: $"
                                    + Number(
                                        context.raw
                                      ).toLocaleString(
                                        undefined,
                                        {
                                            maximumFractionDigits: 8
                                        }
                                      );

                            }

                        }

                    }

                },


                scales: {

                    x: {

                        title: {

                            display: true,

                            text: "Time"

                        },

                        ticks: {

                            maxTicksLimit: 10

                        }

                    },


                    y: {

                        title: {

                            display: true,

                            text: "WDM Price (USD)"

                        },

                        beginAtZero: false,

                        ticks: {

                            callback: function(value) {

                                return "$"
                                    + Number(value)
                                        .toLocaleString(
                                            undefined,
                                            {
                                                maximumFractionDigits: 8
                                            }
                                        );

                            }

                        }

                    }

                }

            }

        });

    }

    catch (error) {

        console.error(
            "WDM CHART ERROR:",
            error
        );

    }

}


// ==========================================================
// 페이지 로드
// ==========================================================

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadWDMChart();

    }
);

</script>

</body>

</html>
```
