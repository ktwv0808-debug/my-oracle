<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<title>WDM Market Chart</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{

    background:#111;

    color:white;

    font-family:Arial;

    margin:0;

    padding:20px;

}

.container{

    width:95%;

    margin:auto;

}

canvas{

    background:#222;

    border-radius:10px;

}

</style>

</head>

<body>

<div class="container">

<h2 align="center">

📈 WDM Market Chart

</h2>

<canvas id="chart" height="120"></canvas>

</div>


<script>

let chart = null;


async function loadChart(){

    try{

        const res = await fetch("/wdm-chart-data");

        const data = await res.json();


        if(chart){

            chart.destroy();

        }


        chart = new Chart(

            document.getElementById("chart"),

            {

                type:"line",


                data:{

                    labels:data.labels,


                    datasets:[

                    //--------------------------------------------------
                    // WDM PRICE
                    //--------------------------------------------------

                    {

                        label:"WDM",

                        data:data.prices,

                        borderColor:"white",

                        backgroundColor:"white",

                        borderWidth:2,

                        pointRadius:0,

                        tension:0.2,

                        spanGaps:false

                    }

                    ]

                },


                options:{

                    responsive:true,

                    animation:false,


                    interaction:{

                        intersect:false,

                        mode:"index"

                    },


                    plugins:{

                        legend:{

                            labels:{

                                color:"white"

                            }

                        }

                    },


                    scales:{

                        x:{

                            ticks:{

                                color:"white",

                                maxTicksLimit:10

                            },

                            grid:{

                                color:"#444"

                            }

                        },


                        y:{

                            beginAtZero:false,

                            ticks:{

                                color:"white"

                            },

                            grid:{

                                color:"#444"

                            }

                        }

                    }

                }

            }

        );

    }

    catch(error){

        console.error(

            "WDM Market Chart Error:",

            error

        );

    }

}


loadChart();


// ------------------------------------------------------------
// Refresh WDM market data every 5 seconds
// ------------------------------------------------------------

setInterval(

    loadChart,

    5000

);

</script>

</body>

</html>
