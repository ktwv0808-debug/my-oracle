<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>
WDM Market Information
</title>

<script src="/static/language.js"></script>

<style>

body{

    font-family:Arial;

    background:#f5f5f5;

    text-align:center;

}

.box{

    width:700px;

    margin:50px auto;

    background:white;

    padding:40px;

    border-radius:20px;

    box-shadow:0 0 20px #aaa;

}

button{

    display:block;

    width:350px;

    margin:15px auto;

    padding:15px;

    font-size:18px;

    background:#0066cc;

    color:white;

    border:none;

    border-radius:15px;

    cursor:pointer;

    transition:0.2s;

}

button:hover{

    background:#003b80;

}

/* ==========================================================
   Swap Button
========================================================== */

.swap{

    background:#28a745;

}

.swap:hover{

    background:#1f7d35;

}

/* ==========================================================
   WDM Chart Button
========================================================== */

.wdm-chart{

    background:#0066cc;

}

.wdm-chart:hover{

    background:#003b80;

}

/* ==========================================================
   Close Button
========================================================== */

.close{

    background:#333;

}

.close:hover{

    background:#111;

}

select{

    padding:8px;

    cursor:pointer;

}

</style>

<script>

function popup(url){

    window.open(

        url,

        "_blank",

        "width=700,height=650,resizable=yes"

    );

}

function closeTrading(){

    window.close();

}

</script>

</head>

<body>

<div class="box">

<!-- ==========================================================
     Language
========================================================== -->

<div align="right">

Language :

<select

id="language"

onchange="changeLanguage()">

<option value="en">

English

</option>

<option value="ko">

한국어

</option>

</select>

</div>


<!-- ==========================================================
     Page Title
========================================================== -->

<h1

data-en="WDM Market Information"

data-ko="WDM 마켓 정보">

WDM Market Information

</h1>


<!-- ==========================================================
     ETH Price
========================================================== -->

<button

data-en="ETH Price"

data-ko="ETH 가격"

onclick="popup('/price')">

ETH Price

</button>


<!-- ==========================================================
     Save ETH Price
========================================================== -->

<button

data-en="Save ETH Price"

data-ko="ETH 가격 저장"

onclick="popup('/save-price')">

Save ETH Price

</button>


<!-- ==========================================================
     Price History
========================================================== -->

<button

data-en="Price History"

data-ko="가격 기록"

onclick="popup('/history')">

Price History

</button>


<!-- ==========================================================
     Auto Trading Signal
     ETH market information service
========================================================== -->

<button

data-en="Auto Trading Signal"

data-ko="자동 거래 신호"

onclick="popup('/trade-check')">

Auto Trading Signal

</button>


<!-- ==========================================================
     Trading Records
     ETH market information service
========================================================== -->

<button

data-en="Trading Records"

data-ko="거래 기록"

onclick="popup('/trades')">

Trading Records

</button>


<!-- ==========================================================
     WDM Price Chart
========================================================== -->

<button

class="wdm-chart"

data-en="WDM Chart"

data-ko="WDM 차트"

onclick="popup('/wdm-chart')">

📈 WDM Chart

</button>


<!-- ==========================================================
     ETH ↔ WDM 환산
     Price conversion / reference
========================================================== -->

<button

class="swap"

data-en="ETH ↔ WDM Conversion"

data-ko="ETH ↔ WDM 환산"

onclick="popup('/swap')">

🔄 ETH ↔ WDM 환산

</button>

<!-- ==========================================================
     Close
========================================================== -->

<button

class="close"

data-en="Close"

data-ko="닫기"

onclick="closeTrading()">

Close

</button>


</div>

</body>

</html>
