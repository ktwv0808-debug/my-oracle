<!DOCTYPE html>

<html>

<head>

<title>
Content
</title>

<style>

body{

    font-family:Arial;

}

.topbar{

    text-align:right;

    margin-bottom:20px;

}

.close-btn{

    display:inline-block;

    padding:8px 20px;

    background:#0066cc;

    color:white;

    text-decoration:none;

    border-radius:8px;

    font-weight:bold;

}

.close-btn:hover{

    background:#004999;

}

table{

    border-collapse:collapse;

    width:90%;

}

th,td{

    border:1px solid #ccc;

    padding:10px;

}

</style>

<script>

function closePopup(){

    window.open("","_self");

    window.close();

}

</script>

</head>

<body>

<div class="topbar">

<button
class="close-btn"
onclick="closePopup()">

✖ Close

</button>

</div>

<h1>
Content
</h1>

<hr>

<table>

<tr>

<th>No</th>

<th>Title</th>

<th>Attachment</th>

<th>Views</th>

<th>Date</th>

</tr>

{% for row in rows %}

<tr>

<td>{{ loop.index }}</td>

<td>

<a href="/content/{{ row.id }}">

{{ row.title }}

</a>

</td>

<td>

{% if row.file_path %}

<a href="/download/content/{{ row.id }}">

📎 {{ row.file_name }}

</a>

{% else %}

-

{% endif %}

</td>

<td>{{ row.views }}</td>

<td>{{ row.created_at }}</td>

</tr>

{% endfor %}

</table>

</body>

</html>
