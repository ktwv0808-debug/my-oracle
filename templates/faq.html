<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Frequently Asked Questions</title>

<style>

body{
    width:1000px;
    margin:auto;
    font-family:Arial, Helvetica, sans-serif;
}
<!-- ========================================================== -->
<!-- Close Button -->
<!-- ========================================================== -->

<div style="text-align:right; margin:20px;">

    <button
        onclick="window.close();"
        style="
            padding:8px 20px;
            background:#0066cc;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
        ">

        Close

    </button>

</div>
h1{
    text-align:center;
}

form{
    border:1px solid #ddd;
    padding:20px;
    margin-bottom:30px;
    border-radius:10px;
}

input[type=text],
input[type=email],
textarea{

    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    box-sizing:border-box;

}

textarea{

    height:120px;

}

button{

    padding:10px 25px;
    cursor:pointer;

}

.faq-item{

    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;

}

.question{

    font-weight:bold;
    color:#0056b3;
    font-size:18px;

}

.answer{

    margin-top:10px;
    color:#444;

}

.wait{

    color:red;
    font-style:italic;

}

</style>

</head>

<body>

<h1>Frequently Asked Questions</h1>

<h2>Submit Your Question</h2>

<form method="POST">

<label>Name</label>

<input
type="text"
name="name"
required>

<label>Email</label>

<input
type="email"
name="email"
required>

<label>Question</label>

<textarea
name="question"
required></textarea>

<button type="submit">

Submit Question

</button>

</form>

<hr>

<h2>FAQ List</h2>

{% for faq in faqs %}

<div class="faq-item">

<div class="question">

Q. {{ faq.question }}

</div>

<div class="answer">

{% if faq.answer %}

A. {{ faq.answer }}

{% else %}

<span class="wait">

Awaiting Administrator Response

</span>

{% endif %}

</div>

</div>

{% endfor %}

</body>

</html>
