<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<title>FAQ</title>

<style>

body{

font-family:Arial;

width:1000px;

margin:auto;

}

.question{

background:#f5f5f5;

padding:15px;

margin-top:15px;

font-weight:bold;

}

.answer{

padding:15px;

border:1px solid #ddd;

border-top:none;

}

.wait{

color:red;

font-weight:bold;

}

</style>

</head>

<body>

<h1>

Frequently Asked Questions

</h1>

{% for row in faqs %}

<div class="question">

Q.

{{ row.question }}

</div>

<div class="answer">

{% if row.answer %}

{{ row.answer }}

{% else %}

<div class="wait">

관리자가 답변을 준비중입니다.

</div>

{% endif %}

</div>

{% endfor %}

</body>
</html>
