<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<title>Edit FAQ</title>

<style>

body{

    font-family:Arial;
    background:#f5f5f5;
    margin:40px;

}

.container{

    width:900px;
    margin:auto;

}

input[type=text]{

    width:100%;
    padding:10px;

}

textarea{

    width:100%;
    height:180px;

}

button{

    padding:10px 20px;
    cursor:pointer;

}

.save{

    background:#28a745;
    color:white;
    border:none;

}

.cancel{

    background:#777;
    color:white;
    border:none;
    text-decoration:none;
    padding:10px 20px;

}

</style>

</head>

<body>

<div class="container">

<h2>FAQ 수정</h2>

<form method="POST">

<p>

질문

</p>

<input
type="text"
name="question"
value="{{ faq.question }}"
required>

<p>

답변

</p>

<textarea
name="answer"
required>{{ faq.answer }}</textarea>

<br><br>

<button
class="save"
type="submit">

수정 완료

</button>

<a
class="cancel"
href="/admin/faq">

취소

</a>

</form>

</div>

</body>

</html>
